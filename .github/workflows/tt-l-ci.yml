name: TT L research verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tt_l/requirements-research.txt feedparser==6.0.12 pytz boto3 json-repair
      - run: python -m unittest discover -s tt_l -p 'test_*.py' -v
      - run: python -m tt_l.research.evaluate --output work/regression.json
      - uses: actions/upload-artifact@v4
        with:
          name: tt-l-regression
          path: work/regression.json
