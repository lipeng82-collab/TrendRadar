name: Get Hot News

on:
  schedule:
    # 4 incremental collections/day; at most 3 valuable cards/day.
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [research, probe, evaluate, legacy]
        default: research
      notify:
        type: boolean
        default: false
        description: Send only validated high-value cards to the existing channel
      bootstrap:
        type: boolean
        default: false
        description: Explicitly initialize state when no retained state artifact exists

concurrency:
  group: tt-l-personal-research
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  research:
    if: github.event.inputs.mode != 'legacy' && (github.event_name == 'workflow_dispatch' || vars.TT_L_ENABLE_STANDALONE_API == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r tt_l/requirements-research.txt
      - name: Restore durable state
        id: state
        if: github.event.inputs.mode != 'probe'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/tt_l_state
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" > work/artifacts.json
          ARTIFACT=$(jq -rs --arg b "$BRANCH" '[.[].artifacts[] | select(.name=="tt-l-state" and .expired==false and .workflow_run.head_branch==$b)] | sort_by(.created_at) | last | .id // empty' work/artifacts.json)
          if [ -n "$ARTIFACT" ]; then
            gh api "repos/$REPO/actions/artifacts/$ARTIFACT/zip" > work/state.zip
            unzip -o work/state.zip -d work/tt_l_state
            test -s work/tt_l_state/research.db
          elif [ "$BOOTSTRAP" != "true" ]; then
            echo "::error::No durable state: run research once with bootstrap=true, notify=false. Refusing budget/dedup reset."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Run full-text pipeline
        if: steps.state.outputs.ready == 'true' && github.event.inputs.mode != 'evaluate'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          EVENT: ${{ github.event_name }}
          NOTIFY: ${{ inputs.notify }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$EVENT" = "schedule" ] || [ "$NOTIFY" = "true" ]; then ARGS+=(--notify); fi
          python -m tt_l.research "${ARGS[@]}"
      - name: Live model evaluation without notification
        if: steps.state.outputs.ready == 'true' && github.event.inputs.mode == 'evaluate'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
        run: python -m tt_l.research.evaluate --live --state work/tt_l_state/research.db --output work/tt_l_reports/live-regression.json
      - name: Probe public sources without model or notification
        if: github.event.inputs.mode == 'probe'
        run: python -m tt_l.research --probe
      - name: Checkpoint SQLite after success or partial failure
        if: always() && steps.state.outputs.ready == 'true'
        run: python -c "import sqlite3; c=sqlite3.connect('work/tt_l_state/research.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
      - name: Persist state even after a partial failure
        if: always() && steps.state.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tt-l-state
          path: work/tt_l_state/research.db
          retention-days: 7
          if-no-files-found: error
      - name: Save auditable reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tt-l-report
          path: work/tt_l_reports/
          retention-days: 30
          if-no-files-found: warn
      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f work/tt_l_reports/cards.md ]; then cat work/tt_l_reports/cards.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f work/tt_l_reports/summary.json ]; then
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat work/tt_l_reports/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
  legacy:
    if: github.event.inputs.mode == 'legacy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --no-dev
      - name: Original title-based crawler, manual fallback only
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 通用Webhook配置
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
          GENERIC_WEBHOOK_TEMPLATE: ${{ secrets.GENERIC_WEBHOOK_TEMPLATE }}
          # AI 配置（ai_analysis 和 ai_translation 共享模型配置）
          AI_ANALYSIS_ENABLED: ${{ secrets.AI_ANALYSIS_ENABLED }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          # 远程存储配置
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          GITHUB_ACTIONS: true
        run: uv run python -m trendradar
